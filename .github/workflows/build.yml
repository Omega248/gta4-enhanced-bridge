name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate project files
        run: tools/premake5 vs2022

      - name: Set up problem matching
        uses: ammaraskar/msvc-problem-matcher@master

      - name: Build Release (Win32)
        shell: pwsh
        run: |
          Get-ChildItem build -Filter *.sln | ForEach-Object { Write-Host "solution: $($_.Name)" }
          msbuild /m /v:minimal /p:Configuration=Release /p:Platform=Win32 build/gta4-rtx.sln *>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # The runner's raw logs aren't reachable from the build assistant, so surface errors as annotations.
            Select-String -Path build.log -Pattern ' error |error [A-Z]+[0-9]+|fatal error' |
              Select-Object -First 40 | ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            exit $code
          }

      - name: Upload a_gta4-rtx.asi
        uses: actions/upload-artifact@v4
        with:
          name: a_gta4-rtx-bridge
          path: |
            build/bin/Release/a_gta4-rtx.asi
            build/bin/Release/*.pdb

      - name: Publish binary to the 'bin' branch
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0,7)
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item build/bin/Release/a_gta4-rtx.asi out/
          Set-Content out/BUILD.txt "source commit $sha"
          cd out
          git init -q -b bin
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "build $sha"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" bin
