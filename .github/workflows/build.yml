name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate project files
        run: tools/premake5 vs2022

      - name: Build Release (Win32)
        run: msbuild /m /v:minimal /p:Configuration=Release /p:Platform=Win32 build/gta4-rtx.sln

      - name: Upload a_gta4-rtx.asi
        uses: actions/upload-artifact@v4
        with:
          name: a_gta4-rtx-bridge
          path: |
            build/bin/Release/a_gta4-rtx.asi
            build/bin/Release/*.pdb
